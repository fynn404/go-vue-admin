# 服务器配置
[server]
port = 8080          # 服务器监听端口
mode = debug         # 运行模式：debug-调试模式，release-生产模式

# 数据库配置
[database]
host = localhost     # 数据库服务器地址
port = 3306         # MySQL默认端口
name = course_management_db # 数据库名称
user = root         # 数据库用户名
password = Zz1122     # 数据库密码
max_idle_conns = 10    # 连接池中的最大空闲连接数
max_open_conns = 100   # 数据库的最大打开连接数
conn_max_lifetime = 3600 # 连接可复用的最大时间（秒）

# Redis缓存配置
[redis]
host = localhost     # Redis服务器地址
port = 6379         # Redis默认端口
password =          # Redis访问密码，为空表示无密码
db = 0             # Redis数据库索引（0-15）
pool_size = 10     # Redis连接池大小

# JWT认证配置
[jwt]
secret = your_jwt_secret_key # JWT签名密钥，生产环境需要修改为复杂的随机字符串
expire_hours = 24           # JWT令牌有效期（小时）

# 跨域配置
[cors]
allowed_origins = http://localhost:3000 # 允许跨域请求的源（前端地址）

# 日志配置
[log]
level = debug              # 日志级别：debug, info, warn, error
file_path = logs/app.log   # 日志文件保存路径
max_size = 100            # 单个日志文件的最大大小（MB）
max_backups = 10          # 保留的旧日志文件个数
max_age = 30             # 旧日志文件保留的最大天数
compress = true          # 是否压缩旧日志文件 